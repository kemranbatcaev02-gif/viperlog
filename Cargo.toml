[package]
name = "viperlog"
version = "0.1.0"
edition = "2021"
authors = ["kemranbatcaev02-gif"]
description = "Fast, SIMD-accelerated log scrubber and PII masker"
license = "MIT"
repository = "https://github.com/kemranbatcaev02-gif/viperlog"

[dependencies]
aho-corasick = "1.1"
memchr = "2.7"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
colored = "2.2"
regex = "1.10"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "throughput"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
